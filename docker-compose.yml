services:
  word-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: word_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432" # Porta padrão para o Word-Service
    volumes:
      - word_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  tag-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tag_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432" # Porta para o Tag-Service
    volumes:
      - tag_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  relationship-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: relationship_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432" # Porta para o Relationship-Service
    volumes:
      - relationship_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432" # Porta para o Auth-Service
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # Porta padrão AMQP
      - "15672:15672" # Porta para o painel de gerenciamento
    restart: unless-stopped

volumes:
  word_db_data:
  tag_db_data:
  relationship_db_data:
  auth_db_data: